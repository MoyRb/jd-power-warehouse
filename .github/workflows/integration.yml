name: Integration Tests

# Integration tests require a live Supabase project.
# They must be triggered manually (workflow_dispatch) once NEXT_PUBLIC_SUPABASE_URL
# and NEXT_PUBLIC_SUPABASE_ANON_KEY are configured as repository secrets.
# Removing the push trigger prevents an expected failure on every commit to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Supabase secrets are configured
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Integration tests require Supabase credentials."
            echo "Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY to repository secrets."
            exit 1
          fi

      - run: npm run test:integration
