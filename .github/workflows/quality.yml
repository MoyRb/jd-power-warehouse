name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Unit tests only — integration tests require external Supabase infrastructure.
      # They are skipped here (describe.skipIf guards) and run in the integration workflow.
      - run: npm run test:unit

      - run: npm run build

      - run: npm audit --audit-level=high
